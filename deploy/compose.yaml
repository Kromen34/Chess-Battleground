# Stack du VPS : serveur de jeu + PostgreSQL. Déployée par tools/deployer_serveur.sh
# dans /opt/chessbg/src ; les secrets et sauvegardes vivent hors de ce dossier
# (/opt/chessbg/secrets, /opt/chessbg/backups) pour survivre aux déploiements.
name: chessbg

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: chessbg-server:latest
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
    command: ["--port=7777", "--db-url=http://postgrest:3000"]
    # STEAM_WEB_API_KEY (clé Web API éditeur, Steamworks) : vérifie les tickets Steam des
    # joueurs. Sans ce fichier, tout le monde est invité et les collections sont indisponibles.
    env_file:
      - path: /opt/chessbg/secrets/steam.env
        required: false
    depends_on: [postgrest]
    # Le serveur n'écrit rien sur disque : conteneur en lecture seule, sans privilèges.
    read_only: true
    tmpfs:
      - /home/godot:uid=10001,gid=10001
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Expose le schéma « api » de PostgreSQL en HTTP pour le serveur de jeu (Godot n'a pas
  # de pilote PostgreSQL). Aucun port publié : joignable seulement dans la stack.
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: game_server
      PGRST_OPENAPI_MODE: disabled
    # PGRST_DB_URI (avec le mot de passe du rôle authenticator), généré par remote_setup.sh.
    env_file: /opt/chessbg/secrets/postgrest.env
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Aucun port publié : la BDD n'est joignable que depuis les conteneurs de la stack.
    environment:
      POSTGRES_DB: chessbg
      POSTGRES_USER: chessbg
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessbg -d chessbg"]
      interval: 10s
      retries: 5
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

secrets:
  db_password:
    file: /opt/chessbg/secrets/db_password.txt

volumes:
  db-data:
